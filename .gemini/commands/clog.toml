description = "Review Nanobot logs and update the private bug backlog"
prompt = """
Review the recent Nanobot strategic logs and evaluate everything that occurred AFTER the last startup.
Identify any issues, errors, or anomalies that indicate a bug or a violation of strategic mandates.

### CURRENT STRATEGIC LOG (Last Session)
!{powershell -Command "$latest = Get-ChildItem D:/Nanobot_Storage/logs/nanobot_*.log | Sort-Object LastWriteTime -Descending | Select-Object -First 1; if ($latest) { $lines = Get-Content $latest.FullName; $marker = '--- Initializing Nanobot Strategic Edition ---'; $index = [array]::LastIndexOf($lines, $marker); if ($index -ge 0) { $lines[$index..($lines.Count-1)] } else { $lines | Select-Object -Last 200 } } else { 'No log file found.' }"}

### CURRENT BUG BACKLOG
@strategery/private/BUG_BACKLOG.md

### USER INSTRUCTIONS
{{args}}

## Tracking
For all NEW issues found:
- Add them to strategery/private/BUG_BACKLOG.md with a clear description and priority.
- Do NOT duplicate existing issues in the backlog.

## Present
- List the new issues found and added to the BUG_BACKLOG.
- Offer to start working on the highest priority bug in the backlog immediately.
"""
