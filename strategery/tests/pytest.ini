[pytest]
pythonpath = . ../..
asyncio_mode = auto
markers =
    timeout: set a timeout for the test
filterwarnings =
    ignore:.*is not a valid ApiSpec:UserWarning
    ignore:.*is not a valid HttpElementLocation:UserWarning
    ignore:.*is not a valid AuthType:UserWarning
    ignore:.*is not a valid Environment:UserWarning
    ignore:.*is not a valid PhishBlockThreshold:UserWarning
    ignore:.*is not a valid DynamicRetrievalConfigMode:UserWarning
    ignore:.*google.generativeai.*:FutureWarning